<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Réveils Clients"><title>CITADINES PARIS LA DÉFENSE — RÉVEILS CLIENTS</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><style>
:root{--gold:#e2bd64;--blue:#48cfff;--red:#e23443;--nav:78px}*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Georgia,"Times New Roman",serif}body{display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100dvh;background:radial-gradient(circle at 50% -5%,#123348,#060a0d 34%,#010203 75%);position:relative;overflow:hidden}.view{display:none;height:calc(100dvh - var(--nav));overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 30px}.view.active{display:block}.brand{text-align:center}.fleur{font-size:42px;color:#f2d275;text-shadow:0 2px #8f6414,0 0 22px #e8bd5544}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:900}.title{font-size:23px;line-height:1.15;margin:5px 0}.clock{display:flex;justify-content:center;gap:3px;margin:15px 0 7px}.digit{min-width:34px;height:50px;display:grid;place-items:center;border:1px solid #b7984e;border-radius:7px;background:linear-gradient(#292319 49%,#050505 50%);font:900 31px "Arial Black",Arial;box-shadow:inset 0 0 10px #000}.sep{font:900 27px Arial;align-self:center;color:#f2d275}.today{text-align:center;color:#d8c184;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.card{border:1px solid #5a4d2d;border-radius:18px;background:linear-gradient(145deg,#111315,#040506);padding:14px;margin-top:12px;box-shadow:inset 0 1px #ffffff0c,0 15px 35px #0008}label{display:block;color:#c4aa68;font-size:11px;font-weight:900;letter-spacing:.09em;margin:9px 0 5px}input,textarea,select{width:100%;min-height:52px;border:1px solid #5a4d2d;border-radius:12px;background:#030405;color:#fff;padding:11px 12px;font:700 17px Georgia;outline:none}input:focus,textarea:focus,select:focus{border-color:#e2bd64;box-shadow:0 0 0 3px #e2bd6418}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary,.secondary,.danger{width:100%;min-height:54px;border-radius:13px;font:900 14px Georgia;letter-spacing:.05em}.primary{margin-top:13px;border:1px solid #e7c666;background:linear-gradient(#ad8738,#5d4213);color:#fff}.secondary{border:1px solid #277fa6;background:#071b27;color:#fff}.danger{border:1px solid #8f3039;background:#26090d;color:#ff9da5}.list{display:grid;gap:10px;margin-top:12px}.alarm{position:relative;border:1px solid #5a4d2d;border-radius:16px;background:#080a0c;padding:13px 48px 13px 13px}.alarm time{display:block;color:#f4d881;font:900 24px "Arial Black",Arial}.alarm b{font-size:17px}.alarm small{display:block;color:#9aa5aa;margin-top:6px}.delete{position:absolute;right:10px;top:10px;width:36px;height:36px;border:1px solid #85303a;border-radius:10px;background:#22080c;color:#ff8c96;font-size:22px}.empty{text-align:center;color:#7f898e;padding:28px 10px}.nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:7px 8px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#020304f2;border-top:1px solid #5a4d2d;backdrop-filter:blur(18px)}.nav button{border:0;border-radius:11px;background:transparent;color:#807c72;font:800 10px Georgia}.nav span{display:block;font-size:22px;margin-bottom:3px}.nav .active{color:#efd47e;background:#17130a}.alert{display:none;position:fixed;inset:0;z-index:100;background:#000e;padding:18px;align-items:center;justify-content:center}.alert.show{display:flex}.alert-card{width:min(100%,390px);border:2px solid #e4bd58;border-radius:27px;background:radial-gradient(circle at 50% 0,#47350d,#0a0a09 55%,#020202);padding:26px 18px;text-align:center;box-shadow:0 0 55px #e8bd5540}.alert-card .fleur{font-size:74px}.alert-card h2{font-size:28px;margin:10px 0;color:#fff}.alert-time{font:900 54px "Arial Black",Arial;color:#f5d979}.alert-apt{font-size:21px;margin:8px 0 20px}.pulse{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.04);filter:brightness(1.25)}}.toast{position:fixed;left:50%;bottom:95px;transform:translate(-50%,20px);opacity:0;background:#142318;border:1px solid #4b9167;color:#baffd4;border-radius:99px;padding:10px 15px;font-size:12px;font-weight:900;transition:.2s;z-index:120}.toast.show{opacity:1;transform:translate(-50%,0)}
.nav{grid-template-columns:repeat(4,1fr);gap:3px;padding-left:5px;padding-right:5px}.nav button{font-size:9px}.countdown{margin-top:8px;color:#6fe2ff;font:900 15px "Arial Black",Arial}.event-card{border-color:#277fa6!important}.event-card time{color:#70dcff!important}
</style></head><body><main class="app">
<section class="view active" id="home"><div class="brand"><div class="fleur">⚜</div><div class="eyebrow">ASM TECHNOLOGIES</div><h1 class="title">CITADINES PARIS LA DÉFENSE<br>RÉVEILS CLIENTS</h1></div><div class="clock" id="clock"></div><div class="today" id="today"></div><div class="card"><div class="eyebrow">NOUVEAU RÉVEIL</div><label>NUMÉRO D’APPARTEMENT</label><input id="apt" inputmode="numeric" placeholder="Ex. 604"><div class="grid"><div><label>DATE</label><input id="date" type="date"></div><div><label>HEURE</label><input id="time" type="time"></div></div><label>OBSERVATION</label><textarea id="note" placeholder="Facultatif"></textarea><button class="primary" onclick="addAlarm()">ENREGISTRER LE RÉVEIL</button></div><div class="card"><button id="notifBtn" class="secondary" onclick="toggleNotifications()">ACTIVER LES NOTIFICATIONS SONORES</button><label>SONNERIE DU RÉVEIL</label><select id="tone" onchange="saveTone()"><option value="mechanical">RÉVEIL MÉCANIQUE — CLOCHE</option><option value="digitalAlarm">RÉVEIL NUMÉRIQUE — BIP BIP</option><option value="clockBuzzer">RADIO-RÉVEIL — BUZZER</option><option value="morningAlarm">ALARME DU MATIN — FORTE</option></select><button class="primary" style="margin-top:9px" onclick="testTone()">TESTER LE RÉVEIL</button></div></section>
<section class="view" id="alarms"><div class="brand"><div class="eyebrow">ASM TECHNOLOGIES</div><h2 class="title">RÉVEILS PROGRAMMÉS</h2></div><div class="list" id="alarmList"></div></section>
<section class="view" id="events"><div class="brand"><div class="eyebrow">ASM TECHNOLOGIES</div><h2 class="title">ÉVÉNEMENTS</h2></div><div class="card"><label>NOM DE L’ÉVÉNEMENT</label><input id="eventTitle" placeholder="Ex. Appeler un client"><div class="grid"><div><label>DATE</label><input id="eventDate" type="date"></div><div><label>HEURE</label><input id="eventTime" type="time"></div></div><label>MESSAGE</label><textarea id="eventNote" placeholder="Informations complémentaires"></textarea><button class="primary" onclick="addEvent()">ENREGISTRER L’ÉVÉNEMENT</button></div><div class="list" id="eventList"></div></section>
<section class="view" id="history"><div class="brand"><div class="eyebrow">ASM TECHNOLOGIES</div><h2 class="title">HISTORIQUE</h2></div><div class="list" id="historyList"></div><button class="danger" style="margin-top:14px" onclick="clearHistory()">EFFACER L’HISTORIQUE</button></section>
<nav class="nav"><button class="active" data-page="home" onclick="go('home')"><span>⌂</span>ACCUEIL</button><button data-page="alarms" onclick="go('alarms')"><span>◷</span>RÉVEILS</button><button data-page="events" onclick="go('events')"><span>◆</span>ÉVÉNEMENTS</button><button data-page="history" onclick="go('history')"><span>▤</span>HISTORIQUE</button></nav>
<div class="alert" id="alert"><div class="alert-card pulse"><div class="fleur">⚜</div><div class="eyebrow">ASM TECHNOLOGIES</div><h2>RÉVEIL CLIENT</h2><div class="alert-time" id="alertTime"></div><div class="alert-apt" id="alertApt"></div><button class="primary" onclick="stopAlert()">J’AI PRIS EN COMPTE</button></div></div><div class="toast" id="toast"></div></main><script>
const KEY='asmWakeAlarms',EVENTS='asmWakeEvents',HIST='asmWakeHistory',NOTIF='asmWakeNotifications',TONE='asmWakeTone';let alarms=JSON.parse(localStorage.getItem(KEY)||'[]'),events=JSON.parse(localStorage.getItem(EVENTS)||'[]'),history=JSON.parse(localStorage.getItem(HIST)||'[]'),ringTimer=null,audioCtx=null,currentAlert=null;const $=id=>document.getElementById(id),localDate=d=>{const x=d||new Date(),o=x.getTimezoneOffset();return new Date(x.getTime()-o*60000).toISOString().slice(0,10)};
function init(){const now=new Date(Date.now()+5*60000);$('date').value=$('eventDate').value=localDate();$('time').value=$('eventTime').value=now.toTimeString().slice(0,5);const saved=localStorage.getItem(TONE);$('tone').value=['mechanical','digitalAlarm','clockBuzzer','morningAlarm'].includes(saved)?saved:'mechanical';localStorage.setItem(TONE,$('tone').value);tick();setInterval(tick,1000);setInterval(checkAlarms,1000);render();updateNotif();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=7',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{})}
function tick(){const n=new Date(),t=n.toLocaleTimeString('fr-FR',{hour12:false});$('clock').innerHTML=t.split('').map(c=>/\d/.test(c)?`<span class="digit">${c}</span>`:`<span class="sep">${c}</span>`).join('');$('today').textContent=n.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});renderCountdowns()}
function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id!=='home')render()}
function addAlarm(){const apt=$('apt').value.trim(),date=$('date').value,time=$('time').value,note=$('note').value.trim();if(!apt||!date||!time){toast('COMPLÈTE APPARTEMENT, DATE ET HEURE');return}const at=new Date(`${date}T${time}:00`);if(at<=new Date()){toast('CHOISIS UNE HEURE À VENIR');return}alarms.push({id:Date.now(),apt,date,time,note,fired:false});save();$('apt').value='';$('note').value='';render();toast('RÉVEIL ENREGISTRÉ')}
function save(){localStorage.setItem(KEY,JSON.stringify(alarms));localStorage.setItem(EVENTS,JSON.stringify(events));localStorage.setItem(HIST,JSON.stringify(history))}function removeAlarm(id){alarms=alarms.filter(a=>a.id!==id);save();render();toast('RÉVEIL SUPPRIMÉ')}function removeEvent(id){events=events.filter(a=>a.id!==id);save();render();toast('ÉVÉNEMENT SUPPRIMÉ')}function clearHistory(){history=[];save();render();toast('HISTORIQUE EFFACÉ')}
function addEvent(){const title=$('eventTitle').value.trim(),date=$('eventDate').value,time=$('eventTime').value,note=$('eventNote').value.trim();if(!title||!date||!time){toast('COMPLÈTE NOM, DATE ET HEURE');return}if(new Date(`${date}T${time}:00`)<=new Date()){toast('CHOISIS UNE HEURE À VENIR');return}events.push({id:Date.now(),type:'event',title,date,time,note,fired:false});save();$('eventTitle').value='';$('eventNote').value='';render();toast('ÉVÉNEMENT ENREGISTRÉ')}
function card(a,done=false){const event=a.type==='event',name=event?a.title:'APPARTEMENT '+a.apt;return `<div class="alarm ${event?'event-card':''}"><time>${a.time}</time><b>${name}</b><small>${new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date(a.date+'T12:00:00')).toUpperCase()}${a.note?' · '+a.note:''}</small>${done?'':`<div class="countdown" id="count-${a.type||'alarm'}-${a.id}"></div><button class="delete" onclick="${event?'removeEvent':'removeAlarm'}(${a.id})">×</button>`}</div>`}function render(){const sorted=[...alarms].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),sortedEvents=[...events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('alarmList').innerHTML=sorted.map(a=>card(a)).join('')||'<div class="empty">AUCUN RÉVEIL PROGRAMMÉ</div>';$('eventList').innerHTML=sortedEvents.map(a=>card(a)).join('')||'<div class="empty">AUCUN ÉVÉNEMENT PROGRAMMÉ</div>';$('historyList').innerHTML=[...history].reverse().map(a=>card(a,true)).join('')||'<div class="empty">AUCUNE ALERTE EFFECTUÉE</div>';renderCountdowns()}
function renderCountdowns(){[...alarms,...events].forEach(a=>{const el=$(`count-${a.type||'alarm'}-${a.id}`);if(!el)return;let s=Math.max(0,Math.floor((new Date(`${a.date}T${a.time}:00`)-Date.now())/1000)),d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;el.textContent='DANS '+(d?d+'J ':'')+[h,m,sec].map(n=>String(n).padStart(2,'0')).join(':')})}
async function toggleNotifications(){if(localStorage.getItem(NOTIF)==='1'){localStorage.setItem(NOTIF,'0');updateNotif();toast('NOTIFICATIONS DÉSACTIVÉES');return}if(!('Notification'in window)){toast('NOTIFICATIONS NON DISPONIBLES');return}const p=await Notification.requestPermission();if(p!=='granted'){toast('AUTORISE LES NOTIFICATIONS IPHONE');return}localStorage.setItem(NOTIF,'1');unlockAudio();updateNotif();toast('NOTIFICATIONS ACTIVÉES')}function updateNotif(){const on='Notification'in window&&Notification.permission==='granted'&&localStorage.getItem(NOTIF)==='1';$('notifBtn').textContent=on?'NOTIFICATIONS SONORES ACTIVÉES':'ACTIVER LES NOTIFICATIONS SONORES'}
function unlockAudio(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}function saveTone(){localStorage.setItem(TONE,$('tone').value);toast('RÉVEIL ENREGISTRÉ');testTone()}function testTone(){beep()}function beep(){unlockAudio();const kind=localStorage.getItem(TONE)||'mechanical',now=audioCtx.currentTime,compressor=audioCtx.createDynamicsCompressor(),master=audioCtx.createGain();compressor.threshold.value=-17;compressor.knee.value=5;compressor.ratio.value=18;compressor.attack.value=.001;compressor.release.value=.12;master.gain.setValueAtTime(.94,now);master.connect(compressor).connect(audioCtx.destination);function hit(start,duration,f1,f2,type='square',level=.8){const g=audioCtx.createGain(),a=audioCtx.createOscillator(),b=audioCtx.createOscillator();a.type=b.type=type;a.frequency.setValueAtTime(f1,start);b.frequency.setValueAtTime(f2,start);g.gain.setValueAtTime(.001,start);g.gain.linearRampToValueAtTime(level,start+.008);g.gain.setValueAtTime(level,start+duration-.025);g.gain.exponentialRampToValueAtTime(.001,start+duration);a.connect(g);b.connect(g);g.connect(master);a.start(start);b.start(start);a.stop(start+duration+.02);b.stop(start+duration+.02)}if(kind==='digitalAlarm'){[0,.22,.44,.9,1.12,1.34].forEach(t=>hit(now+t,.15,1080,1320,'square',.75))}else if(kind==='clockBuzzer'){[0,.3,.6,.9,1.2,1.5].forEach((t,i)=>hit(now+t,.22,i%2?720:860,i%2?760:920,'sawtooth',.8))}else if(kind==='morningAlarm'){[0,.25,.5,.75,1,1.25,1.5].forEach((t,i)=>hit(now+t,.19,i%2?950:1250,i%2?1120:1450,'square',.78))}else{for(let i=0;i<13;i++)hit(now+i*.13,.095,i%2?1180:1480,i%2?1420:1730,'triangle',.9)}if(navigator.vibrate)navigator.vibrate(kind==='mechanical'?[180,70,180,70,180,70,500]:[300,100,300,100,500])}
async function fire(a){a.fired=true;currentAlert=a;history.push({...a,doneAt:new Date().toISOString()});save();const event=a.type==='event';$('alertTime').textContent=a.time;$('alertApt').textContent=(event?a.title:'APPARTEMENT '+a.apt)+(a.note?' · '+a.note:'');document.querySelector('.alert-card h2').textContent=event?'ÉVÉNEMENT':'RÉVEIL CLIENT';$('alert').classList.add('show');beep();ringTimer=setInterval(beep,1800);if(localStorage.getItem(NOTIF)==='1'&&Notification.permission==='granted'){const reg=await navigator.serviceWorker.ready;reg.showNotification('⚜ ASM TECHNOLOGIES',{body:event?`ÉVÉNEMENT — ${a.title} — ${a.time}`:`RÉVEIL CLIENT — APPARTEMENT ${a.apt} — ${a.time}`,icon:'icon-192.png',badge:'icon-192.png',tag:(event?'event-':'wake-')+a.id,requireInteraction:true})}}
function stopAlert(){clearInterval(ringTimer);ringTimer=null;$('alert').classList.remove('show');if(currentAlert?.type==='event')events=events.filter(a=>!a.fired);else alarms=alarms.filter(a=>!a.fired);currentAlert=null;save();render()}function checkAlarms(){const n=new Date();[...alarms,...events].filter(a=>!a.fired).forEach(a=>{const at=new Date(`${a.date}T${a.time}:00`);if(n>=at&&n-at<60000)fire(a)})}function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}init();
</script></body></html>
